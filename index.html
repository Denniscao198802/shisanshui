<script>
// 浏览器版 wx 适配层：让小游戏代码原样在手机浏览器里运行
// 手机竖着拿时自动把画面转 90°，始终以横屏牌桌显示
(function () {
  const canvas = document.getElementById('game');
  const touchHandlers = { start: [], move: [], end: [], cancel: [] };
  const hideH = [], showH = [], kbH = [];
  let rotated = false, vw = 0, vh = 0;

  function measure() {
    vw = window.innerWidth; vh = window.innerHeight;
    rotated = vh > vw;
    const W = rotated ? vh : vw, H = rotated ? vw : vh;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    if (rotated) {
      canvas.style.transformOrigin = '0 0';
      canvas.style.transform = 'translate(' + vw + 'px,0) rotate(90deg)';
    } else {
      canvas.style.transform = 'none';
    }
    return { W, H };
  }
  let dims = measure();

  function toGame(t) {
    // 竖屏旋转时：画布坐标 x = 屏幕 y，y = 屏幕宽 - 屏幕 x
    return rotated ? { clientX: t.clientY, clientY: vw - t.clientX } : { clientX: t.clientX, clientY: t.clientY };
  }
  function fire(kind, list, changed) {
    const ev = { touches: Array.from(list).map(toGame), changedTouches: Array.from(changed).map(toGame) };
    touchHandlers[kind].forEach(f => f(ev));
  }
  const opt = { passive: false };
  canvas.addEventListener('touchstart', e => { e.preventDefault(); unlockAudio(); fire('start', e.touches, e.changedTouches); }, opt);
  canvas.addEventListener('touchmove', e => { e.preventDefault(); fire('move', e.touches, e.changedTouches); }, opt);
  canvas.addEventListener('touchend', e => { e.preventDefault(); fire('end', e.touches, e.changedTouches); }, opt);
  canvas.addEventListener('touchcancel', e => { fire('cancel', e.touches, e.changedTouches); }, opt);
  // 电脑浏览器用鼠标
  let mouseDown = false;
  canvas.addEventListener('mousedown', e => { mouseDown = true; unlockAudio(); fire('start', [e], [e]); });
  window.addEventListener('mousemove', e => { if (mouseDown) fire('move', [e], [e]); });

    const avail = toolbarX - 44 - colMin - 14 - leftBound;
    const basePanelW = 24 + 96 + 5 * 88 - 8 + 16 + 70 + 20;
    const k = Math.min(1, avail / basePanelW);
    const slotW = 80 * k, slotH = 112 * k, gap = 8 * k, labelW = 96 * k, checkW = 70 * k;
    const panelW = basePanelW * k;
    const panelH = 3 * slotH + 2 * 16 + 28;
    const panelY = Math.max(8, handY - 28 - panelH);
    const panelX = Math.max(leftBound, Math.min(cx - panelW / 2 - 90, toolbarX - 44 - colMin - 14 - panelW));
    const colX = panelX + panelW + 14, colW = Math.min(240, toolbarX - 56 - colX);
    return { W, H, s, cx, toolbarX, narrow, infoW, infoX, barH, barY, handH, handW, handY, slotW, slotH, gap, labelW, checkW, panelW, panelH, panelX, panelY, colX, colW, k };
  }

  function rowRect(L, r) {
    const i = ROWS.indexOf(r);
    const y = L.panelY + 14 + i * (L.slotH + 16);
    return { x: L.panelX + 10, y: y - 4, w: L.panelW - 20 - L.checkW - 10, h: L.slotH + 8, slotY: y };
  }
  function slotX(L, r, j) {
    const off = r === 'front' ? 1 : 0;
    return L.panelX + 24 + L.labelW + (j + off) * (L.slotW + L.gap);
  }
  function handLayout(L) {
    const n = S.hand.length;
    const avail = L.W - L.s.left - L.s.right - 60;
    const step = n > 1 ? Math.min(L.handW * 0.86, (avail - L.handW) / 12) : 0;
    const total = L.handW + (n - 1) * step;
    const x0 = L.W / 2 - total / 2;
    return S.hand.map((c, i) => ({ c, x: x0 + i * step, y: L.handY - (S.selected[c] ? 26 : 0), w: L.handW, h: L.handH }));
  }

  // ---------- 状态操作 ----------
  function snapshot() { S.undo.push({ hand: S.hand.slice(), rows: { front: S.rows.front.slice(), mid: S.rows.mid.slice(), back: S.rows.back.slice() } }); if (S.undo.length > 50) S.undo.shift(); }
  function changed() { S.typeCache = null; S.typeCycle = {}; }
  function sortHand() { S.hand = cards.sortCards(S.hand); }

  function placeCards(row, list) {
    if (S.phase !== 'arranging' || S.submitted) return false;
    const space = CAP[row] - S.rows[row].length;
    if (!list.length) return false;
    if (list.length > space) { core.toast(ROW_TITLE[row] + '还能放 ' + space + ' 张'); return false; }
    snapshot();
    // 牌可能来自手牌或其他墩
    ROWS.forEach(r => { S.rows[r] = S.rows[r].filter(c => list.indexOf(c) < 0); });
    S.hand = S.hand.filter(c => list.indexOf(c) < 0);
    S.rows[row] = cards.sortCards(S.rows[row].concat(list));
    const t = now();
    list.forEach(c => { S.placedAt[c] = t; delete S.selected[c]; });
    // 只剩一墩且张数正好时自动补齐
    const left = ROWS.filter(r => S.rows[r].length < CAP[r]);
    if (left.length === 1 && S.hand.length === CAP[left[0]] - S.rows[left[0]].length) {
      S.hand.forEach(c => { S.placedAt[c] = t; });
      S.rows[left[0]] = cards.sortCards(S.rows[left[0]].concat(S.hand));
      S.hand = [];
    }
    S.selected = {};
    changed();
    audio.play('place');
    return true;
  }

  function returnToHand(list) {
    if (S.phase !== 'arranging' || S.submitted) return;
    snapshot();
    ROWS.forEach(r => { S.rows[r] = S.rows[r].filter(c => list.indexOf(c) < 0); });
    S.hand = cards.sortCards(S.hand.concat(list));
    changed();
    audio.play('select');
  }

  function undo() {
    if (S.submitted) return;
    const u = S.undo.pop();
    if (!u) { core.toast('没有可撤回的操作'); return; }
    S.hand = u.hand; S.rows = u.rows; S.selected = {};
    changed();
    audio.play('select');
  }

  function clearAll() {
    if (S.submitted) return;
    const placed = S.rows.front.concat(S.rows.mid, S.rows.back);
    if (!placed.length) { S.selected = {}; return; }
    snapshot();
    S.hand = cards.sortCards(S.hand.concat(placed));
    S.rows = { front: [], mid: [], back: [] };
    S.selected = {};
    changed();
    audio.play('select');
  }

  function quickArrange() {
    if (S.submitted) return;
    if (!S.suggestions) S.suggestions = ev.autoArrange(match.myHand(ME), rules, 5);
    S.sIdx = (S.sIdx + 1) % S.suggestions.length;
    const sg = S.suggestions[S.sIdx];
    snapshot();
    S.rows = { front: sg.rows.front.slice(), mid: sg.rows.mid.slice(), back: sg.rows.back.slice() };
    S.hand = [];
    S.selected = {};
    const t = now();
    S.rows.front.concat(S.rows.mid, S.rows.back).forEach(c => { S.placedAt[c] = t; });
    changed();
    audio.play('place');
    core.toast('方案 ' + (S.sIdx + 1) + '/' + S.suggestions.length + '：' + sg.names.join(' / '), 1400);
  }

  function typeCombos(cat) {
    if (!S.typeCache) S.typeCache = {};
    if (!S.typeCache[cat]) S.typeCache[cat] = ev.findCombos(S.hand, cat, rules);
    return S.typeCache[cat];
  }

  function pickType(cat) {
    const list = typeCombos(cat);
    if (!list.length) return;
    const idx = ((S.typeCycle[cat] == null ? -1 : S.typeCycle[cat]) + 1) % list.length;
    S.typeCycle = {}; S.typeCycle[cat] = idx;
    S.selected = {};
    list[idx].forEach(c => { S.selected[c] = true; });
    audio.play('select');
  }

  function isComplete() { return S.rows.front.length === 3 && S.rows.mid.length === 5 && S.rows.back.length === 5; }
  function isFoulNow() { return isComplete() && ev.isFoul(S.rows.front, S.rows.mid, S.rows.back, rules); }

  function confirmSubmit() {
    if (S.submitted || S.phase !== 'arranging') return;
    if (!isComplete()) { core.toast('还没摆完'); return; }
    const go = () => {
      if (S.submitted) return;                 // 防重复点击
      const err = match.submit(ME, S.rows, false);
      if (err) { core.toast(err); return; }
      S.submitted = true;
      audio.play('place');
    };
    if (isFoulNow()) common.confirm('倒水了', '要求 头道 ≤ 中道 ≤ 尾道。倒水会对所有人三墩全输，确定这样出牌？', '硬出', go, '再摆摆');
    else go();
  }

  function declareSpecial() {
    if (S.submitted || !S.special) return;
    common.confirm('报到：' + S.special.name, '报到后不比三墩，直接按特殊牌型计分。', '报到', () => {
      if (S.submitted) return;
      const rows = S.special.rows;
      S.rows = { front: rows.front.slice(), mid: rows.mid.slice(), back: rows.back.slice() };
      S.hand = [];
      const err = match.submit(ME, S.rows, true);
      if (err) { core.toast(err); return; }
      S.submitted = true;
      changed();
    });
  }

  // ---------- 对局事件 ----------
  function onDeal() {
    S.phase = 'dealing'; S.phaseAt = now();
    S.hand = match.myHand(ME);
    S.rows = { front: [], mid: [], back: [] };
    S.selected = {}; S.undo = []; S.suggestions = null; S.sIdx = -1; changed();
    S.submitted = false; S.record = null; S.compare = null; S.timeoutNotified = false; S.lastTickSec = -1;
    S.special = rules.special.enabled ? ev.detectSpecial(S.hand, rules) : null;
    audio.play('deal');
  }

  function onSettled(rec) {
    S.record = rec;
    // 超时/退出代摆时，界面同步显示系统摆好的牌
    const mine = rec.entries[ME].rows;
    S.rows = { front: mine.front.slice(), mid: mine.mid.slice(), back: mine.back.slice() };
    S.hand = [];
    if (rec.by[ME] === 'timeout') core.toast('时间到，系统已按最优方案代摆', 2200);
    startCompare(rec);
  }

  match.on('deal', onDeal);
  match.on('settled', onSettled);

  // ---------- 比牌时间线 ----------
  function startCompare(rec) {
    S.phase = 'comparing'; S.phaseAt = now();
    const sp = speed();
    const events = [];
    let t = 400 * sp;
    const n = rec.entries.length;
    const res = rec.result;
    const specials = res.players.map(p => !!p.special);
    for (let r = 0; r < 3; r++) {
      for (let i = 0; i < n; i++) {
        if (specials[i] && r > 0) continue;
        events.push({ t, type: 'flip', seat: i, row: specials[i] ? -1 : r });
        t += 380 * sp;
      }
      events.push({ t, type: 'rowScore', row: r });
      t += 450 * sp;
    }
    res.pairs.forEach(p => {
      if (p.gun >= 0) {
        events.push({ t, type: 'gun', shooter: p.gun, target: p.gun === p.a ? p.b : p.a });
        t += 750 * sp;
      }
    });
    res.players.forEach((p, i) => { if (p.homerun) { events.push({ t, type: 'homerun', seat: i }); t += 1000 * sp; } });
    events.push({ t, type: 'total' });
    t += 1300 * sp;
    events.push({ t, type: 'summary' });
    S.compare = { events, fired: 0, end: t };
  }

  function compareState() {
    const c = S.compare;
    const el = now() - S.phaseAt;
    const st = { flipped: {}, rowScores: [], guns: [], homeruns: [], total: false, el };
    c.events.forEach((e, idx) => {
      if (e.t > el) return;
      if (idx >= c.fired) {
        c.fired = idx + 1;
        if (e.type === 'flip') audio.play('reveal');
        if (e.type === 'gun') audio.play('gun');
        if (e.type === 'total') audio.play(S.record.result.players[ME].score >= 0 ? 'win' : 'lose');
        if (e.type === 'summary') { openSummary(); }
      }
      if (e.type === 'flip') { if (e.row < 0) st.flipped[e.seat] = [1, 1, 1]; else { (st.flipped[e.seat] = st.flipped[e.seat] || [0, 0, 0])[e.row] = 1; } }
      if (e.type === 'rowScore') st.rowScores.push(e.row);
      if (e.type === 'gun') st.guns.push(Object.assign({ age: el - e.t }, e));
      if (e.type === 'homerun') st.homeruns.push(Object.assign({ age: el - e.t }, e));
      if (e.type === 'total') st.total = true;
    });
    return st;
  }

  function skipCompare() {
    if (S.phase !== 'comparing' || !S.compare) return;
    const last = S.compare.events[S.compare.events.length - 1];
    S.phaseAt = now() - last.t + 1;
    S.compare.fired = S.compare.events.length - 1; // 只触发最后的结算
  }

  function openSummary() {
    if (S.phase === 'result' || S.phase === 'over') return;
    S.phase = match.phase === 'over' ? 'over' : 'result';
    summaryModal();
  }

  // ---------- 继续 / 结束 ----------
  function nextRound() {
    core.modals.length = 0;
    if (match.phase === 'over') { finalModal(); return; }
    if (!match.startRound()) core.toast('无法开始下一局');
  }

  function saveRecord(quit) {
    if (S.saved || !match.history.length) return;
    S.saved = true;
    const totals = match.players.map(p => p.total);
    const sorted = totals.slice().sort((a, b) => b - a);
    store.addRecord({
      date: formatDate(new Date(now())),
      mode: '单机练习',
      planned: rules.roundsPerMatch,
      quit: !!quit,
      names: match.players.map(p => p.name),
      totals,
      myTotal: totals[ME],
      rank: sorted.indexOf(totals[ME]) + 1,
      rounds: match.history.map(h => ({ n: h.roundNo, scores: h.result.players.map(p => p.score) }))
    });
  }

  function exitTable() {
    const inRound = S.phase === 'arranging' || S.phase === 'dealing' || S.phase === 'waiting';
    common.confirm('退出练习', inRound ? '本局还没结束。退出后本局由系统代你摆牌并结算，然后结束本场。' : '确定结束本场并返回大厅？', '退出', () => {
      if (inRound) match.quit(ME); else match.phase = 'over';
      saveRecord(match.history.length < rules.roundsPerMatch);
      app.toLobby();
    });
  }

  // ---------- 弹窗：结算 ----------
  function summaryModal() {
    const rec = S.record;
    const res = rec.result;
    const myScore = res.players[ME].score;
    const m = {
      draw(ctx) {
        const w = Math.min(core.W - 80, 1240), h = 690;
        const r = common.modalFrame(ctx, null, w, h, () => core.closeModal(m));
        ui.ribbon(ctx, core.W / 2, r.y - 50, myScore > 0 ? '胜 利' : myScore < 0 ? '失 败' : '平 局', myScore > 0 ? 'win' : myScore < 0 ? 'lose' : 'draw');
        const n = rec.entries.length;
        const rowH = 118;
        const top = r.y + 64;
        const cw = Math.min(62, (w - 520) / 13.5), chh = cw * 1.36, step = cw * 0.66;
        rec.entries.forEach((e, i) => {
          const y = top + i * rowH;
          if (i === ME) { ctx.fillStyle = 'rgba(243,195,91,0.18)'; rr(ctx, r.x + 20, y - 6, w - 40, rowH - 6, 14); ctx.fill(); }
          const p = match.players[i];
          ui.avatar(ctx, r.x + 40, y + 10, 76, p.name, { isBot: p.isBot });
          ui.text(ctx, p.name, r.x + 210, y + 30, { size: 24, align: 'center', color: '#6a4a20', maxW: 150 });
          const sc = res.players[i].score;
          ui.text(ctx, (sc > 0 ? '+' : '') + sc, r.x + 210, y + 66, { size: 30, bold: true, align: 'center', color: sc > 0 ? '#d2321e' : sc < 0 ? '#2c6fd6' : '#6a4a20' });
          ui.text(ctx, '累计 ' + rec.totals[i], r.x + 210, y + 96, { size: 18, align: 'center', color: '#9a8a70' });
          let x = r.x + 300;
          ROWS.forEach((rk, k) => {
            const cs = e.rows[rk];
            const assign = res.players[i].assigns[k];
            cs.forEach((c, j) => ui.card(ctx, c, x + j * step, y + 6, cw, chh, cardOpt(c, assign)));
            const wRow = cw + (cs.length - 1) * step;
            ui.bigLabel(ctx, res.players[i].special ? '' : res.players[i].rowNames[k], x + wRow / 2, y + chh - 8, 26);
            x += wRow + cw * 0.5;
          });
          const tags = tagsFor(i);
          ui.text(ctx, tags, x + 4, y + 50, { size: 20, bold: true, color: '#c0661a', maxW: r.x + w - x - 30 });
        });
        const by = r.y + h - 96;
        ui.button(ctx, 'sm-detail', r.x + 40, by, 210, 70, '得分明细', () => detailModal(rec), { style: 'blue', size: 26 });
        ui.button(ctx, 'sm-verify', r.x + 270, by, 210, 70, '公平验证', () => common.verifyModal(match.verifyLast(), rec.fairness), { style: 'dark', size: 26 });
        ui.button(ctx, 'sm-next', r.x + w - 300, by, 260, 76, match.phase === 'over' ? '查看总成绩' : '继续游戏', () => { audio.play('button'); nextRound(); }, { style: 'gold', size: 32 });
      }
    };
    core.openModal(m);
  }

  function tagsFor(i) {
    const res = S.record.result;
    const p = res.players[i];
    const t = [];
    if (p.special) t.push('报到·' + p.special);
    if (p.foul) t.push('倒水');
    res.pairs.forEach(pr => { if (pr.gun === i) t.push('打枪' + match.players[pr.gun === pr.a ? pr.b : pr.a].name); });
    if (p.homerun) t.push('全垒打');
    if (p.horse) t.push('马牌×' + p.horse);
    return t.join(' ');
  }

  function cardOpt(c, assign) {
    const o = {};
    if (cards.isJoker(c) && assign) {
      const a = assign.find(x => x.id === c);
      if (a) o.jokerAs = { rank: a.rank, suit: a.suit };
    }
    if (!cards.isJoker(c) && rules.horse.enabled && rules.horse.cards.indexOf(cards.baseOf(c)) >= 0) o.horse = true;
    return o;
  }

  // ---------- 弹窗：得分明细 ----------
  function detailModal(rec) {
    let seat = ME;
    const names = match.players.map(p => p.name);
    const m = {
      draw(ctx) {
        const w = Math.min(core.W - 100, 1180), h = 660;
        const r = common.modalFrame(ctx, '得分明细', w, h, () => core.closeModal(m));
        // 选择查看谁的明细
        names.forEach((nm, i) => ui.button(ctx, 'dt-seat' + i, r.x + 40 + i * 190, r.y + 50, 176, 56, nm, () => { seat = i; core.scrollState.detail = { off: 0 }; }, { style: seat === i ? 'gold' : 'dark', size: 24 }));
        const P = rec.result.players[seat];
        const exp = scoring.explainFor(rec.result, seat, names);
        const fmt = v => (v > 0 ? '+' : '') + v;
        const summary = '头墩 ' + fmt(P.rowTotals[0]) + '　中墩 ' + fmt(P.rowTotals[1]) + '　尾墩 ' + fmt(P.rowTotals[2]) + '　打枪/特殊等 ' + fmt(P.extraTotal) + '　＝ 本局 ' + fmt(P.score);
        ui.text(ctx, summary, r.x + 40, r.y + 140, { size: 24, bold: true, color: '#6a3f10', maxW: w - 80 });
        const blockH = e => 50 + e.lines.length * 34;

        core.scrollArea('detail', r.x + 20, r.y + 170, w - 40, h - 200, contentH, (c, top) => {
          let y = top;
          exp.forEach(e => {
            c.fillStyle = 'rgba(138,90,26,0.1)'; rr(c, r.x + 30, y, w - 80, blockH(e), 12); c.fill();
            ui.text(c, '对 ' + e.name, r.x + 50, y + 26, { size: 24, bold: true, color: '#3a2a18' });
            ui.text(c, (e.total > 0 ? '+' : '') + e.total, r.x + w - 80, y + 26, { size: 28, bold: true, align: 'right', color: e.total > 0 ? '#d2321e' : e.total < 0 ? '#2c6fd6' : '#3a2a18' });
            e.lines.forEach((l, k) => ui.text(c, l, r.x + 70, y + 64 + k * 34, { size: 22, color: '#4a3a28', maxW: w - 160 }));
            y += blockH(e) + 12;
          });
        });
      }
    };
    core.openModal(m);
  }

  // ---------- 弹窗：整场总成绩 ----------
  function finalModal() {
    saveRecord(false);
    const order = match.players.map((p, i) => i).sort((a, b) => match.players[b].total - match.players[a].total);
    const m = {
      draw(ctx) {

        const myRank = order.indexOf(ME) + 1;

          ui.avatar(ctx, r.x + 140, y + 9, 64, p.name, { isBot: p.isBot });

          ui.text(ctx, (p.total > 0 ? '+' : '') + p.total, r.x + r.w - 100, y + 41, { size: 34, bold: true, align: 'right', color: p.total > 0 ? '#d2321e' : p.total < 0 ? '#2c6fd6' : '#3a2a18' });
        });
        ui.button(ctx, 'fm-lobby', r.x + 80, r.y + r.h - 100, 300, 76, '返回大厅', () => { app.toLobby(); }, { style: 'dark', size: 30 });
        ui.button(ctx, 'fm-again', r.x + r.w - 380, r.y + r.h - 100, 300, 76, '再来一场', () => { app.startPractice(); }, { style: 'gold', size: 30 });
      }
    };
    core.openModal(m);
  }

  // ---------- 绘制 ----------
  function drawInfo(ctx, L) {

    ui.text(ctx, tags, x + 160, y + 86, { size: 20, color: '#f3c35b', maxW: 120 });

    ui.button(ctx, 'info-verify', x + 146, y + 112, 132, 50, '公平验证', () => common.verifyModal(match.verifyLast(), match.history.length ? match.history[match.history.length - 1].fairness : null), { style: 'gold', size: 22, radius: 8 });
  }

  function drawToolbar(ctx, L) {
    const x = L.toolbarX;
    ui.iconButton(ctx, 'tb-set', x, 56, 36, ui.glyphs.gear, () => common.settingsModal());
    ui.iconButton(ctx, 'tb-rule', x, 140, 36, ui.glyphs.book, () => common.rulesModal(rules));
    ui.iconButton(ctx, 'tb-snd', x, 224, 36, ui.glyphs.sound(store.settings.sound), () => { store.settings.sound = !store.settings.sound; store.saveSettings(); core.toast(store.settings.sound ? '音效已开' : '音效已关', 900); });

const DEFAULT_SETTINGS = {
  sound: true,
  fastAnim: false,
  nickname: '我',
  practice: { rounds: 10, arrangeSeconds: 60, jokers: 0, special: false, horse: true, wheelRank: 'lowest' }
};

function load(key, def) {
  try {
    const v = wx.getStorageSync(key);
    if (v === '' || v == null) return JSON.parse(JSON.stringify(def));
    return v;
  } catch (e) { return JSON.parse(JSON.stringify(def)); }
}
function save(key, v) { try { wx.setStorageSync(key, v); } catch (e) {} }

const store = {
  settings: null,
  records: null,
  init() {
    const s = load('settings', DEFAULT_SETTINGS);
    this.settings = Object.assign({}, DEFAULT_SETTINGS, s);
    this.settings.practice = Object.assign({}, DEFAULT_SETTINGS.practice, s.practice || {});
    this.records = load('records', []);
  },
  saveSettings() { save('settings', this.settings); },
  addRecord(r) {
    this.records.unshift(r);
    this.records = this.records.slice(0, 30);
    save('records', this.records);
  },
  clearRecords() { this.records = []; save('records', []); }
};

module.exports = store;

});

// 横竖屏切换后：保留设置与战绩，重新计算布局并回到大厅
window.__relayout = function () {
  const core = __req('js/engine/core.js');
  const app = __req('game.js');
  const info = wx.getWindowInfo();
  const c = core.canvas;
  c.width = Math.round(info.windowWidth * info.pixelRatio);
  c.height = Math.round(info.windowHeight * info.pixelRatio);
  core.dpr = info.pixelRatio;
  core.scale = info.windowHeight / 750;
  core.W = info.windowWidth / core.scale;
  if (!(core.scene && core.scene.pause)) app.toLobby();
};
__req('game.js');
</script>
